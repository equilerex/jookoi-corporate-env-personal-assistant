version: 2
updates:
  - package-ecosystem: npm
    directory: /viewer
    schedule:
      interval: monthly
    groups:
      npm-all:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /jookoi-md-mcp
    schedule:
      interval: monthly
    groups:
      uv-all:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-all:
        patterns: ["*"]
