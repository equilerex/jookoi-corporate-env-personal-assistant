name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewer:
    name: Viewer (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:web
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-dist
          path: viewer/dist
          if-no-files-found: error

  mcp:
    name: MCP server (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jookoi-md-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: jookoi-md-mcp/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest
