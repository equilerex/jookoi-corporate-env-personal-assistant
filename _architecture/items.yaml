      2. Update `pyproject.toml` package definition, entrypoint, and project name to `jookoi-md-mcp` / `jookoi_md_mcp`.
      3. Rewrite all imports across `src/` and `tests/` from `obsidian_mcp` to `jookoi_md_mcp`.
