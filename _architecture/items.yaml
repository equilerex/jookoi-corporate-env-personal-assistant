  f1lt:
    title: Cross-platform MCP runner scripts and root package.json command hub
    status: done
    priority: 6000
    body: |-
      Make MCP runners environment-agnostic (Git Bash, WSL, macOS, Linux, PowerShell) and establish root package.json with centralized shortcut commands and inline JSON comments.

      Tasks:
      1. Add cross-platform `run-mcp.sh` at repo root:
         - On macOS / native Linux: runs uv directly against jookoi-md-mcp with local Python.
         - On Windows (Git Bash / MSYS / Cygwin): invokes WSL runner seamlessly or directly when already in WSL.
         - Supports foreground and `--bg` / `-b` background flags.
      2. Keep `run-mcp.ps1` for native Windows PowerShell users.
      3. Create root `package.json` with shortcut commands and inline `// <command>` explanations:
         - `mcp:start`: Start MCP server in foreground
         - `mcp:start:bg`: Start MCP server in background
         - `mcp:health`: Run health check endpoint
         - `mcp:test`: Run pytest test suite in WSL / native
         - `paper-trail:check`: Validate paper-trail conformity
         - `paper-trail:sweep`: Run paper-trail sweep
         - `paper-trail:list`: List active paper-trail items
      4. Verify scripts and command execution.
    ts_created: 2026-09-28T20:03:03Z
    ts_started: 2026-09-28T20:03:03Z
    ts_done: 2026-09-28T20:05:01Z
    ts_touched: 2026-09-28T20:05:01Z
