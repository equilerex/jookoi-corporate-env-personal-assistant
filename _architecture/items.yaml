      Next: a small CLI (`scripts/capture.js "text"` or stdin, plus an npm script) that writes a capture from `Templates/capture.md` with `captured:` and `source: cli`. Optionally an editor snippet or a shell alias. It writes files directly, so it doesn't need the server running.
