items:
  mey7:
    title: Build Repo A skeleton per plan
    status: done
    priority: 1000
    body: |-
      Cross-repo: JooKoi-vault item `c9vd` tracks this build from the vault side. Plan: `C:\JooKoi-vault\_architecture\plans\2026-09-28-corporate-env-personal-assistant.md`.

      Build complete and verified end to end:
      - vault/ skeleton + jookoi-md-mcp/ (obsidian-mcp v2.1.0 + 3 patches) — structural build.
      - uv sync in WSL Ubuntu: 80 packages, obsidian_mcp + obsidian_mcp.jookoi import clean.
      - HTTP server running (127.0.0.1:8008, Bearer auth), health + /mcp endpoints verified.
      - All 3 clients wired: Copilot CLI, VS Code Copilot, Gemini CLI/Antigravity.
      - E2E verified: read, search, write+readback, briefing, audit/telemetry logging all confirmed working.
      - Instructions/procedures cleanup sweep done (Meld Encrypt/phone refs replaced with generic equivalents).

      Full detail: HANDOFF.md at repo root.

      Next: git init + initial commit (user-triggered), seed Repo B on corp remote, verify Copilot org MCP policy on corp machine.
    ts_created: 2026-09-28T13:07:30Z
    ts_started: 2026-09-28T13:07:30Z
    ts_done: 2026-09-28T19:37:37Z
    ts_touched: 2026-09-28T19:37:37Z
  y76u:
    title: Seed Repo B on corporate remote from Repo A
    status: now
    priority: 2000
    body: |-
      Repo A skeleton and MCP runtime are complete and verified end-to-end. Next steps:
      1. User initializes git in Repo A (`git init`) and creates the baseline commit.
      2. Clone/init Repo B on the private corp remote.
      3. Seed Repo B with the Repo A skeleton (vault skeleton, jookoi-md-mcp, launchers, AGENTS.md).
      4. On the corp machine: verify WSL availability and org Copilot MCP policy.
    ts_created: 2026-09-28T19:37:46Z
