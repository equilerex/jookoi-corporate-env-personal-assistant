  t3z7:
    title: Corporate calendar into calendar/events
    status: parked
    priority: 12000
    body: |-
      `_AI_INSTRUCTIONS.md` and the procedures treat `calendar/events/` as the calendar copy (frontmatter `date`, `end`), but no sync runner exists on the corp machine. Until one does, the morning brief and daily close can't see meetings.

      Next: find out what the corp allows (Outlook ICS publish URL, Graph API with an app registration, or a manual ICS export). Then write a deterministic runner that writes one note per event. Keep it server-side data only (no reasoning), per the "server supplies, client reasons" rule.
