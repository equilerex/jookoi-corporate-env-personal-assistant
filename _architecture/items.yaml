  l5i1:
    title: Rebuild _architecture/ structure and ARCHITECTURE.md for non-Obsidian corporate stack
    status: done
    priority: 3000
    body: |-
      The initial _architecture/ layout was a minimal placeholder and ARCHITECTURE.md carried old references. This item tracks restructuring _architecture/ to conform to the full jookoi-paper-trail standard and rewriting ARCHITECTURE.md from the ground up for the corporate environment (no Obsidian app, no sync, local WSL HTTP MCP server, plain markdown vault, 3 AI clients).

      Tasks:
      1. Rebuild ARCHITECTURE.md completely: clean topology, exact data layer, MCP server mechanics, WSL runtime details, fixed-heading dependencies, client configuration protocols, and security boundaries.
      2. Establish proper _architecture/ folders: plans/ (with mirror of the build plan), plans/decision-history/, archive/.
      3. Record initial architecture decisions in plans/decision-history/ (e.g. WSL HTTP transport, port 8008 selection, single-user auth model).
      4. Run paper-trail check to verify conformity.
    ts_created: 2026-09-28T19:38:58Z
    ts_started: 2026-09-28T19:38:58Z
    ts_done: 2026-09-28T19:40:52Z
    ts_touched: 2026-09-28T19:40:52Z
  wdk0:
    title: Migrate remaining Obsidian-app assumptions out of vault/ instructions
    status: done
    priority: 4000
    body: |-
      Found via repo-wide grep after the user flagged that a parallel session had left stale Obsidian-app assumptions in vault/ despite the ARCHITECTURE.md rebuild (l5i1) already being done. Scope: vault/ instruction and procedure files only — jookoi-md-mcp/src/obsidian_mcp/* package name and the obsidian-mcp source-repo references stay untouched by design (documented in ARCHITECTURE.md, renaming breaks the 3 patches).

      Fixed:
      - `_procedures/obsidian-syntax.md` renamed to `vault-syntax.md`, retitled "Vault syntax conventions", reframed: no Obsidian app reads this vault, conventions kept for portability not because a plugin runs them.
      - `_AI_INSTRUCTIONS.md`: `procedure:obsidian-syntax` reference updated to `procedure:vault-syntax` (2 spots), "Obsidian Tasks syntax" reframed to "this vault's task syntax, no plugin required".
      - `_procedures/daily-close.md`: "typing in Obsidian" → "typing directly into the note"; "Obsidian comment line" → "hidden marker line (plain text, not rendered specially by any viewer)".
      - `vault-syntax.md` Common failure modes: "where the Tasks plugin expects" → "where the task format expects".

      Verified via repo-wide grep: only remaining Obsidian mention in vault/ is the deliberate explanatory line in vault-syntax.md's intro. jookoi-md-mcp/'s obsidian_mcp package/module references are intentional and out of scope (see ARCHITECTURE.md).
    ts_created: 2026-09-28T19:43:19Z
    ts_started: 2026-09-28T19:43:19Z
    ts_done: 2026-09-28T19:43:25Z
    ts_touched: 2026-09-28T19:43:25Z
  t2lg:
    title: Prune upstream Docker artifacts and replace empty gitkeep files
    status: done
    priority: 5000
    body: |-
      Surgically prune upstream obsidian-mcp artifacts that do not apply to this workstation-based WSL HTTP deployment, and replace all empty .gitkeep files with informative markdown files.

      Actions:
      1. Remove Docker and multi-vault upstream dead weight:
         - jookoi-md-mcp/Dockerfile
         - jookoi-md-mcp/docker-compose.yml
         - jookoi-md-mcp/docker-compose.home-server.yml
         - jookoi-md-mcp/vaults.json.example
         - jookoi-md-mcp/scripts/release.sh
         - jookoi-md-mcp/tests/test_home_server_compose.py
      2. Replace empty .gitkeep files across vault/ and _architecture/ with descriptive Markdown placeholders explaining the folder's role and convention.
      3. Verify pytest suite in WSL passes cleanly.
      4. Run paper-trail check and sweep.
    ts_created: 2026-09-28T19:50:00Z
    ts_started: 2026-09-28T19:50:00Z
    ts_done: 2026-09-28T19:53:54Z
    ts_touched: 2026-09-28T19:53:54Z
  f1lt:
    title: Cross-platform MCP runner scripts and root package.json command hub
    status: done
    priority: 6000
    body: |-
      Make MCP runners environment-agnostic (Git Bash, WSL, macOS, Linux, PowerShell) and establish root package.json with centralized shortcut commands and inline JSON comments.

      Tasks:
      1. Add cross-platform `run-mcp.sh` at repo root:
         - On macOS / native Linux: runs uv directly against jookoi-md-mcp with local Python.
         - On Windows (Git Bash / MSYS / Cygwin): invokes WSL runner seamlessly or directly when already in WSL.
         - Supports foreground and `--bg` / `-b` background flags.
      2. Keep `run-mcp.ps1` for native Windows PowerShell users.
      3. Create root `package.json` with shortcut commands and inline `// <command>` explanations:
         - `mcp:start`: Start MCP server in foreground
         - `mcp:start:bg`: Start MCP server in background
         - `mcp:health`: Run health check endpoint
         - `mcp:test`: Run pytest test suite in WSL / native
         - `paper-trail:check`: Validate paper-trail conformity
         - `paper-trail:sweep`: Run paper-trail sweep
         - `paper-trail:list`: List active paper-trail items
      4. Verify scripts and command execution.
    ts_created: 2026-09-28T20:03:03Z
    ts_started: 2026-09-28T20:03:03Z
    ts_done: 2026-09-28T20:05:01Z
    ts_touched: 2026-09-28T20:05:01Z
  qtl6:
    title: Relocate handoff, rewrite README, and build jookoi-brain-mcp harness skill
    status: done
    priority: 7000
    body: |-
      Relocate build handoff doc to _architecture/plans/implemented/, rewrite repository README.md from scratch, and create corporate-assistant harness skill for cross-project AI integration.

      Tasks:
      1. Move root HANDOFF.md to _architecture/plans/implemented/2026-09-28-repo-a-build-handoff.md.
      2. Rewrite root README.md from scratch:
         - Architecture, single-machine design, transport topology
         - Prerequisites and setup guide (WSL/Ubuntu on Windows, native uv on macOS/Linux)
         - MCP server configuration and endpoints (127.0.0.1:8008, Bearer auth)
         - Configuration snippets for AI clients (Copilot CLI, VS Code Copilot, Gemini CLI, Claude Code)
         - Centralized npm command reference
         - Vault structure and procedures overview
      3. Create harness skill `skills/corporate-assistant/SKILL.md`:
         - Explains vault purpose, server endpoint, auth, and tool surface
         - Dynamic procedure loading via `vault_get_vault_conventions`
         - Domain rules: waking-day convention, secret boundaries, assistant behavior
      4. Add `skill:link` shortcut in package.json to link the skill to ~/.agents/skills/corporate-assistant.
      5. Verify paper-trail check and sweep.
    ts_created: 2026-09-28T20:06:06Z
    ts_started: 2026-09-28T20:06:06Z
    ts_done: 2026-09-28T20:07:20Z
    ts_touched: 2026-09-28T20:07:20Z
  y25k:
    title: Purge remaining Obsidian references across codebase, instructions, and server strings
    status: done
    priority: 8000
    body: |-
      Perform a thorough sweep across the project to purge, modernize, and decouple remaining Obsidian references:
      1. AGENTS.md, README.md, vault-syntax.md, SKILL.md: modernize wording to reflect a standalone markdown knowledge vault without obsolete app baggage.
      2. mcp.env and mcp.env.example: remove .obsidian/ from default deny and exclude paths.
      3. Server strings and prompts (jookoi.py, server.py): reframe system prompts and instructions from "Obsidian vault" / "obsidian-mcp" to "jookoi-md-mcp" and "Markdown vault".
      4. jookoi-md-mcp/README.md and docs/: rewrite/clean upstream documentation to reflect the actual corporate setup rather than the upstream cloud-sync project.
      5. pyproject.toml: update package description and metadata.
      6. Verify pytest test suite passes completely.
    ts_created: 2026-09-28T20:12:36Z
    ts_started: 2026-09-28T20:12:36Z
    ts_done: 2026-09-28T20:17:39Z
    ts_touched: 2026-09-28T20:17:39Z
  j3yp:
    title: Refine naming to jookoi-md-mcp and add jookoi-brain-api skill for direct HTTP usage
    status: done
    priority: 9000
    body: |-
      1. Replace generic capitalized "Vault" descriptions with the explicit MCP product name `jookoi-md-mcp` (vault is simply the target folder `vault/`).
      2. Create sibling skill `skills/jookoi-brain-api/SKILL.md` allowing AI agents and scripts to interface with the backend directly over HTTP without MCP client configuration:
         - Endpoints: /mcp (JSON-RPC tools/call) and /health
         - Expected tool arguments, JSON schemas, headers, and response envelopes
         - Concrete curl examples for read, search, write, briefing, and task operations
      3. Update `scripts/link-skill.js` to link both `jookoi-brain-mcp` and `jookoi-brain-api` into ~/.agents/skills/.
      4. Update README.md and package.json to reflect both skills and refined naming.
    ts_created: 2026-09-28T20:20:00Z
    ts_started: 2026-09-28T20:20:00Z
    ts_done: 2026-09-28T20:26:33Z
    ts_touched: 2026-09-28T20:26:33Z
  epa0:
    title: Restart MCP server and test the corporate vault rules end to end
    status: parked
    priority: 0
    body: |-
      Instructions, skeleton and all procedures are rebuilt for work use (decisions 003, 004). Credentials live in `vault/reference/_jookoi-secrets.md`, git-ignored.

      State 28-09-2026: the server was stopped for a restart (`scripts/stop-mcp.js`), and `run-mcp.sh --bg` did not bring it back (health never answered). Parked because the owner is refactoring the server layout (removing a stray obsidian-mcp subfolder).

      Next, once the refactor lands: start the server and confirm `WRITE_PATHS` includes `teams/` (not `work/` or `research/`). Then run one triage pass on a test capture holding a task, a PR review, a blocker, a colleague fact and a fake token. Check:
      - the token lands only in `_jookoi-secrets.md` and is replaced in the capture
      - the capture moves to `Inbox/_done/`
      - `git status` doesn't show the secrets file
    ts_created: 2026-09-28T21:03:01Z
    ts_started: 2026-09-28T21:03:01Z
    ts_done: null
