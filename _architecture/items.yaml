  d92d:
    title: Windows background launcher leaves no server running
    status: parked
    priority: 19000
    body: |-
      `npm run mcp:start:bg` (`run-mcp.sh --bg` from Git Bash) runs `cmd.exe /c start /b wsl.exe ... ./run.sh`. The server never answers `/health`: this failed twice on 28 and 29 September 2026, and the shell call hung until its timeout. The same `./run.sh` in the foreground in WSL starts fine in about 2 s.

      The likely cause is that the detached `wsl.exe` dies with its parent console. Next step: launch it inside WSL with `nohup ./run.sh >log 2>&1 &` plus `disown` (for example `wsl.exe -d Ubuntu bash -c "cd ... && nohup ./run.sh > run.log 2>&1 & disown"`), then confirm `/health` answers after the Git Bash shell exits. Check `run-mcp.ps1 -Background` too.
    ts_created: 2026-09-29T00:11:24Z
    ts_started: null
    ts_done: null
    ts_touched: 2026-09-29T00:11:24Z
