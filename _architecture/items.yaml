  yxs9:
    title: 'Work procedures: 1:1 prep and performance review prep'
    status: parked
    priority: 13000
    body: |-
      Two recurring work jobs have no procedure yet:
      - **1:1 prep:** gather `Follow-ups.md` lines for the person, their `people/<Name>.md`, the last entries in `people/<Name> - 1on1.md`, and open tasks that mention them. Propose an agenda and append it to the 1on1 page.
      - **Review / brag prep:** build a dated summary for a period from `reference/me/career.md`, `lists/logs/shipped.md`, the weekly accounts and `lists/logs/work-energy.md`.

      Both would be new files in `vault/_procedures/`, served automatically. Waiting for the owner's go-ahead or their own draft, as with triage and daily-close.
