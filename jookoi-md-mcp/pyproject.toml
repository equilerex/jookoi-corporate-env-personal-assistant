[project]
name = "jookoi-md-mcp"
version = "2.1.0"
description = "MCP server for Markdown vaults — read, write, search, graph, canvas, kanban"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.7",
    "python-frontmatter>=1.1",
    "filelock>=3.13",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/equilerex/jookoi-corporate-env-personal-assistant"
Repository = "https://github.com/equilerex/jookoi-corporate-env-personal-assistant"

[project.scripts]
jookoi-md-mcp = "jookoi_md_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jookoi_md_mcp"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["jookoi_md_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
